name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan reachable history for secrets
        shell: bash
        run: |
          set -euo pipefail
          scan_dir="$(mktemp -d)"
          curl --fail --location --silent --show-error --output "$scan_dir/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' > "$scan_dir/SHA256SUMS"
          (cd "$scan_dir" && sha256sum --check SHA256SUMS && tar -xzf gitleaks.tar.gz)
          "$scan_dir/gitleaks" git . --redact --log-opts=--all
  foundation:
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_TEST_THREADS: '4'
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, Node 24
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Validate foundation
        shell: pwsh
        run: ./tools/validate.ps1
      - name: Check explicit restore orchestration paths
        run: python -B tools/test_restore_project.py
      - name: Check catalogue collection interactions
        run: node --test crates/tig-git/tests/work-selection.cjs crates/tig-git/tests/impact.cjs crates/tig-git/tests/ux-flows.cjs crates/tig-git/tests/compare-flows.cjs crates/tig-git/tests/object-flows.cjs
      - name: Check opt-in GitHub request client
        run: node --test examples/github/request.test.mjs
      - name: Rust format, handoff tests and Clippy
        shell: pwsh
        run: |
          git --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git lfs version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'tig-build'
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          $env:TMPDIR = $env:RUNNER_TEMP
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --workspace --all-features --bins --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --all-features --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $env:TIG_RETIREMENT_CLI = Join-Path $env:CARGO_TARGET_DIR "debug/tig-storage$suffix"
          cargo test -p tig-store --lib --locked retirement::tests::explicit_cli_pending_cancellation_qualification -- --ignored --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TIG_BULK_CLI = $env:TIG_RETIREMENT_CLI
          cargo test -p tig-store --lib --locked final_retirement::bulk::tests::explicit_cli_bulk_inspection_qualification -- --ignored --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check -p tig-git --no-default-features --locked
          exit $LASTEXITCODE
      - name: Qualify pre-final provider writer refusal
        shell: pwsh
        run: |
          $baseline = '273e639cd9515f0860140c926240b18e4ca69a1b'
          $baselineRoot = Join-Path $env:RUNNER_TEMP 'tig-pre-final'
          $baselineBuild = Join-Path $env:RUNNER_TEMP 'tig-pre-final-build'
          $env:GIT_LFS_SKIP_SMUDGE = '1'
          git -c core.hooksPath=NUL fetch --no-tags --depth=1 origin $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -c core.hooksPath=NUL worktree add --detach $baselineRoot $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          $env:TMPDIR = $env:RUNNER_TEMP
          cargo build --manifest-path "$baselineRoot/crates/tig-store/Cargo.toml" --target-dir $baselineBuild --bin tig-storage --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $env:TIG_PRE_FINAL_CLI = Join-Path $baselineBuild "debug/tig-storage$suffix"
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'tig-build'
          cargo test -p tig-store --test retirement_cli --locked pre_final_writer_refuses_new_manifest_and_accepts_legacy_control -- --ignored --exact
          exit $LASTEXITCODE
      - name: Qualify pre-pair source reader compatibility
        shell: pwsh
        run: |
          $baseline = 'd81cabe662e0efb976f9ac1c230a1de2ace8e23f'
          $baselineRoot = Join-Path $env:RUNNER_TEMP 'tig-source-baseline'
          $baselineBuild = Join-Path $env:RUNNER_TEMP 'tig-source-baseline-build'
          $env:GIT_LFS_SKIP_SMUDGE = '1'
          git -c core.hooksPath=NUL fetch --no-tags --depth=1 origin $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -c core.hooksPath=NUL worktree add --detach $baselineRoot $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          $env:TMPDIR = $env:RUNNER_TEMP
          cargo build --manifest-path "$baselineRoot/crates/tig-store/Cargo.toml" --target-dir $baselineBuild --bin tig-source --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $env:TIG_BASELINE_SOURCE_CLI = Join-Path $baselineBuild "debug/tig-source$suffix"
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'tig-build'
          cargo test -p tig-store --lib --locked source_claims::admission::tests::baseline_cli_replays_atomic_pairs_without_format_migration -- --ignored --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p tig-store --lib --locked source_claims::subset::tests::baseline_reader_preserves_subset_states_and_retirement_receipt -- --ignored --exact
          exit $LASTEXITCODE
