[package]
name = "tig-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
s3 = ["dep:ureq", "dep:base64"]

[dependencies]
tig-core = { path = "../tig-core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rusqlite = { version = "=0.41.0", features = ["bundled"] }
getrandom = "=0.4.3"
fs2 = "=0.4.3"
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"], optional = true }
base64 = { version = "=0.22.1", optional = true }

[dev-dependencies]
tempfile = "=3.27.0"
